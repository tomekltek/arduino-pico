<script>
'use strict';
// ====================== MODFUNK ======================
// Platformówka w duchu Bruce Lee / Lode Runner. Grafika 16-bit (Amiga / Atari ST):
// logika na siatce 320x192 (kafelki 8x8), rendering x2 = 640x384, cieniowane sprite'y, copper bary.
const W=320,H=192,T=8,COLS=40,ROWS=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const Z=2; // skala renderingu (pół-piksele logiczne = piksele ekranu)
const FONT='"Press Start 2P",monospace';

// --- Poziomy (linie metra) ---------------------------------------
// #  peron/strop    H drabina/schody    T bilet    C kaseta (Turbo-Chrome)
// E  wyjście (wagon) K kanar             P gracz1   Q gracz2   .  pusto

       suit1:'#ffe600',helm1:'#ff8c00',suit2:'#202020',helm2:'#c0c0c0',kanar:'#108030',kanarHat:'#ffd700',alarm:null},
  map:[
"########################################",
"#P.........T......................T....#",

  pal:{bg:'#120408',bg2:'#4a0c14',wall:'#8a2a2a',wallHi:'#d06060',wall2:'#4a1414',ladder:'#d08080',ladderHi:'#ffc0c0',ticket:'#ffffff',exit:'#ff3030',neon:'#ff4060',
       suit1:'#40e0ff',helm1:'#b040ff',suit2:'#202020',helm2:'#c0c0c0',kanar:'#c01010',kanarHat:'#ffd700',alarm:'#ff2020'},
  map:[

// --- Dźwięk (POKEY-owe piski) ------------------------------------
let AC=null,mute=false;
function beep(f,d=0.06,type='square',v=0.08){
  if(mute)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}

// --- Stan --------------------------------------------------------
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault(); onKey(e.code);});
addEventListener('keyup',e=>{keys[e.code]=false;});

let state='title',level=0,lap=0,grid=[],players=[],kanars=[],ticketsLeft=0,frame=0,score=0,flash=0,msg='',msgT=0,lives=5,paused=false;
let twoP=false;

function tile(x,y){ if(x<0||y<0||x>=COLS||y>=ROWS)return '#'; return grid[y][x]; }
function solid(px,py){ return tile(Math.floor(px/T),Math.floor(py/T))==='#'; }
function ladderAt(px,py){ return tile(Math.floor(px/T),Math.floor(py/T))==='H'; }

function mkActor(x,y,kind){ return {x,y,vx:0,vy:0,w:6,h:8,dir:1,kind,onLadder:false,ground:false,anim:0,dead:0,turbo:0,stun:0,respawn:{x,y}}; }

function loadLevel(i){
  const L=LEVELS[i]; grid=L.map.map(r=>r.split('')); kanars=[]; ticketsLeft=0;
  const P1=players[0]||null,P2=players[1]||null; players=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[y][x];
    if(c==='T')ticketsLeft++;
    if(c==='K'){kanars.push(mkActor(x*T+1,y*T,'kanar'));grid[y][x]='.';}
    if(c==='P'){const p=mkActor(x*T+1,y*T,'p1');p.id=0;players.push(p);grid[y][x]='.';}
    if(c==='Q'){if(twoP){const p=mkActor(x*T+1,y*T,'p2');p.id=1;players.push(p);}grid[y][x]='.';}
  }
  // ekstra kanary na kolejnych okrążeniach
  for(let k=kanars.length;k<L.kanarCount+lap;k++){const b=kanars[k%kanars.length];kanars.push(mkActor(b.x,b.y,'kanar'));}
  flash=0; msg=L.name+' – '+L.sub; msgT=150;
}

function startGame(p2){ twoP=p2; level=0; lap=0; score=0; lives=5; players=[]; loadLevel(0); state='play'; beep(440,0.1); }

function onKey(code){
  if(code==='KeyM'){mute=!mute;return;}
  if(code==='KeyP'&&state==='play'){paused=!paused;return;}
  if(state==='title'||state==='over'||state==='win'){
    if(code==='Digit1')startGame(false);
    if(code==='Digit2')startGame(true);
  }
}

// --- Fizyka ------------------------------------------------------
function moveActor(a,dx,dy){
  // ruch poziomy
  a.x+=dx;
  if(dx>0&&(solid(a.x+a.w,a.y)||solid(a.x+a.w,a.y+a.h-1)))a.x=Math.floor((a.x+a.w)/T)*T-a.w;
  if(dx<0&&(solid(a.x,a.y)||solid(a.x,a.y+a.h-1)))a.x=Math.floor(a.x/T)*T+T;
  // pionowy
  a.y+=dy;
  if(dy>0&&(solid(a.x,a.y+a.h)||solid(a.x+a.w-1,a.y+a.h))){a.y=Math.floor((a.y+a.h)/T)*T-a.h;a.vy=0;a.ground=true;}
  if(dy<0&&(solid(a.x,a.y)||solid(a.x+a.w-1,a.y))){a.y=Math.floor(a.y/T)*T+T;a.vy=0;}
}
function centerOnLadder(a){ const cx=a.x+a.w/2; return ladderAt(cx,a.y+a.h/2)||ladderAt(cx,a.y+a.h); }

function updatePlayer(p){
  if(p.dead>0){p.dead--; if(p.dead===0){p.x=p.respawn.x;p.y=p.respawn.y;p.vy=0;p.inv=120;} return;}
  if(p.inv>0)p.inv--;
  const k=p.id===0?{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',j:'Space'}
                   :{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',j:'ShiftLeft'};
  const sp=1.2+(p.turbo>0?0.5:0);
  let dx=0;
  if(keys[k.l]){dx=-sp;p.dir=-1;} if(keys[k.r]){dx=sp;p.dir=1;}
  const onL=centerOnLadder(p);
  const wantU=keys[k.u],wantD=keys[k.d];
  if(onL&&(wantU||wantD||p.onLadder)){
    if(wantU||wantD){p.onLadder=true;}
    if(p.onLadder){
      p.vy=0; let dy=0; if(wantU)dy=-1; if(wantD)dy=1;
      // wyrównaj do drabiny
      const lx=Math.floor((p.x+p.w/2)/T)*T+1; p.x+=(lx-p.x)*0.5;
      moveActor(p,dx*0.6,dy);
      if(!centerOnLadder(p)&&dy<0){p.onLadder=false;p.ground=true;}
      if(dx!==0&&!wantU&&!wantD&&p.ground)p.onLadder=false;
      p.anim+=Math.abs(dy)+Math.abs(dx);
      return;
    }
  } else p.onLadder=false;
  // grawitacja
  p.ground=false; p.vy=Math.min(p.vy+0.25,3);
  if(keys[k.j]&&p.wasGround){p.vy=-3.0;beep(660,0.05,'triangle',0.05);}
  moveActor(p,dx,p.vy);
  p.wasGround=p.ground;
  if(dx!==0)p.anim+=1;
  // zbieranie
  const tx=Math.floor((p.x+p.w/2)/T),ty=Math.floor((p.y+p.h/2)/T);
  const c=tile(tx,ty);
  if(c==='T'){grid[ty][tx]='.';ticketsLeft--;score+=100;beep(880,0.08);beep(1320,0.1);if(ticketsLeft===0){msg='WYJSCIE OTWARTE!';msgT=90;}}
  if(c==='C'){grid[ty][tx]='.';p.turbo=60*8;score+=250;for(let i=0;i<6;i++)setTimeout(()=>beep(400+i*150,0.08),i*60);msg='TURBO-CHROME!';msgT=90;}
  if(c==='E'&&ticketsLeft===0){nextLevel();}
  if(p.turbo>0)p.turbo--;
}

function updateKanar(k,L){
  if(k.stun>0){k.stun--; if(k.stun===0){k.x=k.respawn.x;k.y=k.respawn.y;} return;}
  const sp=L.speed+lap*0.15;
  // cel: najbliższy żywy gracz
  let tgt=null,bd=1e9;
  for(const p of players){if(p.dead)continue;const d=Math.abs(p.x-k.x)+Math.abs(p.y-k.y)*2;if(d<bd){bd=d;tgt=p;}}
  const onL=centerOnLadder(k);
  if(tgt&&onL&&Math.abs(tgt.y-k.y)>4){
    const dy=tgt.y<k.y?-1:1;
    // sprawdź czy drabina prowadzi w tę stronę
    const cx=k.x+k.w/2;
    if((dy<0&&ladderAt(cx,k.y-1))||(dy>0&&ladderAt(cx,k.y+k.h+1))){
      k.onLadder=true;k.vy=0;const lx=Math.floor(cx/T)*T+1;k.x+=(lx-k.x)*0.5;
      moveActor(k,0,dy*sp);k.anim+=1;return;
    }
  }
  k.onLadder=false;
  if(tgt){
    const ddx=tgt.x-k.x;
    if(Math.abs(ddx)>2)k.dir=ddx>0?1:-1;
    // jeśli gracz na innym piętrze i brak drabiny tu – patroluj szukając drabiny
    if(Math.abs(tgt.y-k.y)>4&&!onL){/* patrol dalej w swoim kierunku */}
  }
  k.ground=false;k.vy=Math.min(k.vy+0.25,3);
  const ox=k.x;moveActor(k,k.dir*sp,k.vy);
  if(k.x===ox)k.dir*=-1;
  // nie spadaj z krawędzi (poza przypadkiem gdy ścigasz w dół)
  const fx=k.x+k.w/2+k.dir*4;
  if(k.ground&&!solid(fx,k.y+k.h+1)&&!ladderAt(fx,k.y+k.h+1)&&!(tgt&&tgt.y>k.y+8))k.dir*=-1;
  k.anim+=1;
}

function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function nextLevel(){
  score+=500+100*lap; beep(523,0.1);setTimeout(()=>beep(659,0.1),100);setTimeout(()=>beep(784,0.2),200);
  level++; if(level>=LEVELS.length){level=0;lap++;}
  loadLevel(level);
}

function update(){
  if(state!=='play'||paused)return;
  frame++; const L=LEVELS[level];
  for(const p of players)updatePlayer(p);
  for(const k of kanars){updateKanar(k,L);
    for(const p of players){ if(p.dead||k.stun||(p.inv>0&&!p.turbo))continue;
      if(collide(p,k)){
        if(p.turbo>0){k.stun=60*4;score+=300;beep(200,0.2,'sawtooth',0.1);msg='KANAR STARANOWANY!';msgT=60;}
        else{p.dead=60;lives--;beep(120,0.4,'sawtooth',0.12);flash=8;
          if(lives<=0){state='over';}
        }
      }
    }
  }
  if(msgT>0)msgT--; if(flash>0)flash--;
}

// --- Rysowanie 16-bit (Amiga / Atari ST) ---------------------------
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x*Z),Math.round(y*Z),Math.round(w*Z),Math.round(h*Z));}
function hsv(h,s=1,v=1){const f=(n)=>{const k=(n+h/60)%6;return Math.round(255*v*(1-s*Math.max(0,Math.min(k,4-k,1))));};return `rgb(${f(5)},${f(3)},${f(1)})`;}
function shade(hex,f){const n=parseInt(hex.slice(1),16);const r=Math.min(255,((n>>16)&255)*f|0),g=Math.min(255,((n>>8)&255)*f|0),b=Math.min(255,(n&255)*f|0);return `rgb(${r},${g},${b})`;}
function grad(x,y,w,h,c1,c2,horiz=false){const g=horiz?ctx.createLinearGradient(x*Z,0,(x+w)*Z,0):ctx.createLinearGradient(0,y*Z,0,(y+h)*Z);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(x*Z,y*Z,w*Z,h*Z);}

function drawMan(a,suit,helm){
  const x=a.x,y=a.y,leg=Math.floor(a.anim/4)%2,d=a.dir;
  if(a.turbo>0){suit=hsv((frame*23)%360);helm=hsv((frame*23+180)%360,0.6);}
  if(a.dead&&(a.dead>>2)&1)return;
  if(a.inv>0&&(frame>>2)&1&&!a.turbo)return;
  const sHi=a.turbo?hsv((frame*23+30)%360,0.4):shade(suit,1.25),sLo=shade(suit,0.55),hHi=shade(helm,1.3),hLo=shade(helm,0.6);
  // cień
  rect(x+0.5,y+7.5,5,0.5,'rgba(0,0,0,0.5)');
  // kask (okrągły wizjer)
  rect(x+1,y+0.5,4,0.5,hHi);rect(x+0.5,y+1,5,2,helm);rect(x+0.5,y+3,5,0.5,hLo);
  rect(x+1+(d>0?1.5:0),y+1.5,2.5,1,'#102030');rect(x+1.5+(d>0?1.5:0),y+1.5,1,0.5,'#8fd0ff'); // wizjer + odblask
  // tułów skafandra z cieniowaniem i zamkiem
  rect(x,y+3.5,6,3,suit);rect(x,y+3.5,1,3,sHi);rect(x+5,y+3.5,1,3,sLo);rect(x+2.5,y+4,1,2,sLo);
  // ręka
  rect(x+(d>0?5:0),y+4+(leg?0.5:0),1,1.5,sHi);
  // nogi + buty
  if(a.onLadder){rect(x,y+6.5,2,1.5,suit);rect(x+4,y+6.5,2,1.5,suit);rect(x,y+7.5,2,0.5,sLo);rect(x+4,y+7.5,2,0.5,sLo);}
  else if(leg){rect(x+1,y+6.5,2,1.5,suit);rect(x+3,y+6.5,2,1.5,suit);rect(x+1,y+7.5,2,0.5,'#222');rect(x+3,y+7.5,2,0.5,'#222');}
  else{rect(x,y+6.5,2,1.5,suit);rect(x+4,y+6.5,2,1.5,suit);rect(x,y+7.5,2,0.5,'#222');rect(x+4,y+7.5,2,0.5,'#222');}
  // poświata Turbo-Chrome
  if(a.turbo>0){ctx.save();ctx.globalAlpha=0.25;rect(x-1.5,y-1.5,9,11,hsv((frame*23+90)%360));ctx.restore();}
}
function drawKanar(k,pal){
  if(k.stun){ if((k.stun>>2)&1)return; }
  const x=k.x,y=k.y,leg=Math.floor(k.anim/4)%2,d=k.dir,u=pal.kanar,uHi=shade(u,1.4),uLo=shade(u,0.55);
  rect(x+0.5,y+7.5,5,0.5,'rgba(0,0,0,0.5)');
  // czapka z daszkiem i otokiem
  rect(x+0.5,y,5,1.5,pal.kanarHat);rect(x+0.5,y+1.5,5,0.5,'#222');rect(x+(d>0?4:-0.5),y+1.5,2.5,0.5,'#111');
  // twarz z wąsem
  rect(x+1,y+2,4,2,'#f0c090');rect(x+1.5+(d>0?1.5:0),y+2.5,1,0.5,'#000');rect(x+1.5+(d>0?1:0),y+3.5,2,0.5,'#503010');
  // mundur z guzikami + identyfikator
  rect(x,y+4,6,2.5,u);rect(x,y+4,1,2.5,uHi);rect(x+5,y+4,1,2.5,uLo);rect(x+2.5,y+4.5,1,0.5,'#ffd700');rect(x+2.5,y+5.5,1,0.5,'#ffd700');rect(x+(d>0?3.5:1),y+4.5,1.5,1,'#fff');
  if(leg){rect(x+1,y+6.5,2,1.5,uLo);rect(x+3,y+6.5,2,1.5,uLo);}else{rect(x,y+6.5,2,1.5,uLo);rect(x+4,y+6.5,2,1.5,uLo);}
  rect(x,y+7.5,6,0.5,'#000');
}

function text(s,x,y,c='#fff',big=false,shadow=true){ctx.font=(big?'16px ':'8px ')+FONT;ctx.textBaseline='top';if(shadow){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillText(s,x*Z+2,y*Z+2);}ctx.fillStyle=c;ctx.fillText(s,x*Z,y*Z);}
function center(s,y,c,big){ctx.font=(big?'16px ':'8px ')+FONT;const w=ctx.measureText(s).width/Z;text(s,(W-w)/2,y,c,big);}
function gradText(s,y,big){ctx.font=(big?'32px ':'16px ')+FONT;const w=ctx.measureText(s).width;const x=(W*Z-w)/2;ctx.textBaseline='top';
  ctx.fillStyle='#000';ctx.fillText(s,x+4,y*Z+4);const g=ctx.createLinearGradient(0,y*Z,0,y*Z+(big?32:16));g.addColorStop(0,'#fff');g.addColorStop(0.45,'#ffe080');g.addColorStop(0.5,'#c06000');g.addColorStop(1,'#ffb020');ctx.fillStyle=g;ctx.fillText(s,x,y*Z);}

function copperBars(y0,h,n,speed){for(let i=0;i<n;i++){const yy=y0+i*(h/n);rect(0,yy,W,h/n+0.5,hsv((frame*speed+i*360/n)%360,0.8,0.5+0.5*Math.sin(i/n*Math.PI)));}}

function drawTile(c,px,py,pal){
  if(c==='#'){ // peron: bevel 3D + płytki
    rect(px,py,T,T,pal.wall);rect(px,py,T,1,pal.wallHi);rect(px,py,0.5,T,pal.wallHi);
    rect(px,py+T-1.5,T,1.5,pal.wall2);rect(px+T-0.5,py,0.5,T,pal.wall2);
    rect(px+(py/T&1?4:0.5),py+3,3,0.5,pal.wall2);rect(px+(py/T&1?4.5:1),py+3.5,3,0.5,'rgba(255,255,255,0.15)');
  } else if(c==='H'){ // drabina: rurki z połyskiem
    rect(px+1,py,1.5,T,pal.ladder);rect(px+1,py,0.5,T,pal.ladderHi);
    rect(px+5.5,py,1.5,T,pal.ladder);rect(px+5.5,py,0.5,T,pal.ladderHi);
    for(const sy of [1.5,5.5]){rect(px+1,py+sy,6,1,pal.ladder);rect(px+1,py+sy,6,0.5,pal.ladderHi);}
  } else if(c==='T'){ // bilet
    const b=Math.sin(frame/8);rect(px+1,py+2.5,6,3.5,pal.ticket);rect(px+1,py+2.5,6,0.5,'#fff');rect(px+1.5,py+3.5,1.5,1.5,'#000');
    rect(px+4,py+3.5,2,0.5,'#c08000');rect(px+4,py+4.5,2,0.5,'#c08000');if(b>0.6)rect(px+1,py+2.5,1,3.5,'rgba(255,255,255,0.8)');
  } else if(c==='C'){ // kaseta magnetofonowa
    rect(px-0.5,py+1.5,9,6,'#1a1a1a');rect(px-0.5,py+1.5,9,0.5,'#555');rect(px+0.5,py+2.5,7,2,'#e8e0c0');
    rect(px+1,py+5,2,2,'#eee');rect(px+5,py+5,2,2,'#eee');rect(px+1.5,py+5.5,1,1,'#000');rect(px+5.5,py+5.5,1,1,'#000');
    rect(px+3,py+5.5,2,1,hsv((frame*17)%360));rect(px+1,py+3,6,0.5,hsv((frame*17+120)%360));
  } else if(c==='E'){ // wagon metra: drzwi + okno + lampy
    const open=ticketsLeft===0,col=open?pal.exit:'#444';
    rect(px-3,py-9,14,17,shade(col,0.6));rect(px-2.5,py-8.5,13,16,col);rect(px-2.5,py-8.5,13,0.5,shade(col,1.5));
    rect(px-1,py-7,10,4,open?'#cfe8ff':'#222');rect(px-1,py-7,10,1,'#fff');
    rect(px+3.75,py-2,0.5,10,shade(col,0.5)); // szczelina drzwi
    const l=(frame>>3)&1;rect(px-2.5,py-9.5,1,1,l?'#ff0':'#550');rect(px+9.5,py-9.5,1,1,l?'#550':'#ff0');
    if(open){rect(px+1,py,6,8,'rgba(0,0,0,0.5)');if((frame>>3)&1)rect(px+2,py+1,4,6,'#fff');}
  }
}

function draw(){
  const L=LEVELS[level],pal=L.pal;
  ctx.setTransform(1,0,0,1,0,0);
  if(state==='title'){drawTitle();return;}
  // tło: gradient + migające alarmy / flash
  grad(0,0,W,H,pal.bg,pal.bg2);
  if(pal.alarm&&state==='play'&&(frame%60)<6){ctx.save();ctx.globalAlpha=0.45;rect(0,0,W,H,pal.alarm);ctx.restore();}
  if(flash>0){ctx.save();ctx.globalAlpha=0.6;rect(0,0,W,H,'#ff2020');ctx.restore();}
  // neonowe rury w tle tunelu
  ctx.save();ctx.globalAlpha=0.18;for(let i=0;i<4;i++)rect(0,30+i*44,W,1,pal.neon);ctx.restore();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawTile(grid[y][x],x*T,y*T,pal);
  // neonowa tablica nazwy stacji
  ctx.save();ctx.globalAlpha=0.35+0.15*Math.sin(frame/10);text(L.name,W-8-L.name.length*4,13,pal.neon,false,false);ctx.restore();
  for(const k of kanars)drawKanar(k,pal);
  players.forEach((p,i)=>drawMan(p,i===0?pal.suit1:pal.suit2,i===0?pal.helm1:pal.helm2));
  // HUD – pasek z gradientem
  grad(0,0,W,8,'#303848','#101420');rect(0,8,W,0.5,'#6a7a90');
  text('WYNIK '+String(score).padStart(6,'0'),3,0.5,'#fff');
  text('ZYCIA '+lives,120,0.5,'#ff8080');
  text('BILETY '+ticketsLeft,180,0.5,pal.ticket);
  text(String(level+1)+(lap?'+'+lap:'')+' '+L.name,236,0.5,pal.neon);
  if(msgT>0){ctx.save();ctx.globalAlpha=0.6;rect(0,84,W,22,'#000');ctx.restore();gradText(msg,88,false);}
  const tp=players.find(p=>p.turbo>0);
  if(tp){rect(99,183,122,6,'#000');for(let i=0;i<Math.floor(tp.turbo/4);i++)rect(100+i,184,1,4,hsv((frame*23+i*6)%360));}
  if(paused)center('PAUZA',96,'#fff',true);
  if(state==='over'){ctx.save();ctx.globalAlpha=0.85;rect(50,66,220,60,'#000');ctx.restore();rect(50,66,220,0.5,'#f44');rect(50,125.5,220,0.5,'#f44');
    gradText('ZLAPALI CIE!',74,false);center('WYNIK '+score,98,'#fff');center('1 = 1 GRACZ   2 = 2 GRACZY',112,'#aaa');}
}
let scrollX=W;
const SCROLL='   MODFUNK W WERSJI AMIGA / ATARI ST ...  ZBIERAJ BILETY, UNIKAJ KANAROW, ZNAJDZ KASETE I WLACZ TURBO-CHROME ...  KOLOR SKAFANDRA ZALEZY OD LINII METRA ...  POZDROWIENIA DLA WSZYSTKICH PASAZEROW BEZ BILETU ...   ';
function drawTitle(){
  grad(0,0,W,H,'#000010','#101840');
  copperBars(14,26,13,2);
  // kratka w stylu dem
  ctx.save();ctx.globalAlpha=0.12;for(let i=0;i<W;i+=16)rect(i,0,0.5,H,'#8af');for(let i=0;i<H;i+=16)rect(0,i,W,0.5,'#8af');ctx.restore();
  gradText('MODFUNK',18,true);
  center('UCIECZKA PRZED KANARAMI',56,'#cfd8ff');
  center('AMIGA / ATARI ST EDITION',68,'#7a86b0');
  // panel z poziomami
  ctx.save();ctx.globalAlpha=0.55;rect(14,84,292,80,'#000');ctx.restore();rect(14,84,292,0.5,'#8af');rect(14,164,292,0.5,'#8af');
  LEVELS.forEach((L,i)=>{const y=90+i*14;const a={x:22,y,w:6,h:8,dir:1,anim:frame>>2,turbo:0,dead:0,onLadder:false};drawMan(a,L.pal.suit1,L.pal.helm1);text((i+1)+'. '+L.name+' - '+L.sub,36,y,L.pal.neon);});
  const a={x:22,y:134,w:6,h:8,dir:1,anim:frame>>2,turbo:1,dead:0,onLadder:false};drawMan(a,'#fff','#fff');text('KASETA = TURBO-CHROME, TARANUJ KANAROW!',36,134,'#fff');
  const b={x:22,y:148,w:6,h:8,dir:1,anim:frame>>2,turbo:0,dead:0,onLadder:false};drawMan(b,'#202020','#c0c0c0');text('GRACZ 2 = CZARNY SKAFANDER',36,148,'#aaa');
  const kk={x:200,y:148,w:6,h:8,dir:-1,anim:frame>>2,stun:0};drawKanar(kk,LEVELS[0].pal);text('KANAR',212,148,'#ff8');
  if((frame>>4)&1)center('WCISNIJ 1 (1 GRACZ) LUB 2 (2 GRACZY)',170,'#ffff40');
  // sinusoidalny scroller
  ctx.font='8px '+FONT;scrollX-=0.6;const tw=ctx.measureText(SCROLL).width/Z;if(scrollX<-tw)scrollX=W;
  for(let i=0;i<SCROLL.length;i++){const cx=scrollX+i*8;if(cx<-8||cx>W)continue;text(SCROLL[i],cx,182+Math.sin(frame/8+i/2)*3,hsv((frame*3+i*10)%360,0.5));}
}

// --- Pętla 60Hz ----------------------------------------------------
let last=0,acc=0;
function loop(t){const dt=Math.min(t-last,100);last=t;acc+=dt;while(acc>=1000/60){update();acc-=1000/60;if(state==='title')frame++;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
